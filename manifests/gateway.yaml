apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: agentgateway-proxy, namespace: agentgateway-system}
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
  - {name: http, port: 80, protocol: HTTP, allowedRoutes: {namespaces: {from: All}}}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata: {name: anthropic, namespace: agentgateway-system}
spec:
  ai:
    provider:
      anthropic: {model: claude-haiku-4-5-20251001}
  policies:
    auth: {secretRef: {name: anthropic-secret}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: anthropic, namespace: agentgateway-system}
spec:
  parentRefs: [{name: agentgateway-proxy, namespace: agentgateway-system}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /anthropic}}]
    backendRefs: [{name: anthropic, namespace: agentgateway-system, group: agentgateway.dev, kind: AgentgatewayBackend}]
